  <!-- Tap-to-play hint -->
  <div id="tap-hint" style="
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 3rem;
    padding: 0.65rem 1.4rem;
    color: rgba(192, 229, 247, 0.9);
    font-family: 'Courier New', Courier, monospace;
    font-size: clamp(0.75rem, 2.5vw, 0.95rem);
    letter-spacing: 0.05em;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 9999;
    white-space: nowrap;
    animation: hint-fadein 0.8s ease forwards, hint-pulse 2s ease-in-out 0.8s infinite;
    transition: opacity 0.6s ease;
  ">
    ♪ tap anywhere to play music
  </div>

  <style>
    @keyframes hint-fadein {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
      to   { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes hint-pulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.04); }
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const audio = document.getElementById("bg-music");
      const hint  = document.getElementById("tap-hint");

      function hideHint() {
        hint.style.animation = "none";
        hint.style.opacity = "0";
        hint.style.transform = "translate(-50%, -50%) scale(0.95)";
        hint.style.transition = "opacity 0.6s ease, transform 0.6s ease";
        setTimeout(function () { hint.style.display = "none"; }, 650);
      }

      function enableAudio() {
        audio.play().then(hideHint).catch(function(){});
        document.removeEventListener("click",      enableAudio);
        document.removeEventListener("touchstart", enableAudio);
      }

      audio.play().then(function () {
        // Autoplay succeeded — no hint needed
      }).catch(function () {
        // Autoplay blocked — show the hint
        hint.style.display = "block";
        document.addEventListener("click",      enableAudio);
        document.addEventListener("touchstart", enableAudio);
      });
    });
  </script>
